<title>Mirror Ward</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=UnifrakturMaguntia&display=swap">
<style>

  :root {
    --ground: #0b090b;
    --ink: #e9e1d2;
    --dim: #8c8078;
    --line: #3a3236;
    --glow: #f3ead8;
    --font-ui: "Pixelify Sans", ui-monospace, "SF Mono", Menlo, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { background: var(--ground); color: var(--ink); font-family: var(--font-ui); overflow: hidden; }
  .stage { height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding-inline: 16px; padding-block: 12px; }
  .frame { line-height: 0; max-width: 100%; }
  canvas { display: block; max-width: 100%; touch-action: none; cursor: pointer; }
  .hud { display: flex; flex-direction: column; gap: 8px; width: 100%; box-sizing: border-box; }
  .row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; }
  .hud h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: 0.04em; }
  .hud p { margin: 2px 0 0; font-size: 13px; color: var(--dim); }
  .controls { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
  button, select { font: inherit; font-size: 14px; color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 0; padding: 6px 12px; cursor: pointer; }
  select option { background: var(--ground); color: var(--ink); }
  button:hover, select:hover { border-color: var(--dim); }
  label { font-size: 13px; color: var(--dim); display: flex; align-items: center; gap: 6px; }
  input[type=range] { accent-color: var(--ink); width: 100px; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--glow); outline-offset: 2px; }
</style>

<main class="stage" id="stage">
  <div class="frame"><canvas id="view" aria-label="Dithered pixel-art scene"></canvas></div>
  <div class="hud" id="hud">
    <div class="row">
      <div>
        <h1 id="sceneName">Mirror Ward</h1>
        <p id="sceneNote">Loading…</p>
      </div>
      <div class="controls">
        <button id="newBtn" type="button">New game</button>
        <button id="prevBtn" type="button" aria-label="Previous area">&lt;</button>
        <select id="sceneSel" aria-label="Jump to area"></select>
        <button id="nextBtn" type="button" aria-label="Next area">&gt;</button>
      </div>
    </div>
    <div class="row controls">
      <label for="sunAz">Sun angle <input id="sunAz" type="range" min="0" max="360" value="250"></label>
      <label for="sunEl">Sun height <input id="sunEl" type="range" min="8" max="80" value="28"></label>
      <button id="spinBtn" type="button" aria-pressed="false">Turn sun</button>
      <button id="ditherBtn" type="button" aria-pressed="true">Dither: on</button>
    </div>
  </div>
</main>
