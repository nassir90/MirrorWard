<title>Sprite Shadows</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap">
<style>

  :root {
    --ground: #0b090b;
    --ink: #e9e1d2;
    --dim: #8c8078;
    --line: #3a3236;
    --glow: #f3ead8;
    --font-ui: "Pixelify Sans", ui-monospace, "SF Mono", Menlo, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { background: var(--ground); color: var(--ink); font-family: var(--font-ui); overflow: hidden; }
  .stage { height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding-inline: 16px; padding-block: 12px; }
  .frame { line-height: 0; max-width: 100%; }
  canvas { display: block; max-width: 100%; touch-action: none; cursor: pointer; }
  .hud { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 20px; width: 100%; box-sizing: border-box; }
  .hud h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: 0.04em; }
  .hud p { margin: 2px 0 0; font-size: 13px; color: var(--dim); }
  .controls { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
  button { font: inherit; font-size: 14px; color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 0; padding: 6px 12px; cursor: pointer; }
  button:hover { border-color: var(--dim); }
  label { font-size: 13px; color: var(--dim); display: flex; align-items: center; gap: 6px; }
  input[type=range] { accent-color: var(--ink); width: 110px; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--glow); outline-offset: 2px; }
</style>

<main class="stage" id="stage">
  <div class="frame"><canvas id="view" aria-label="Isometric dithered scene where pixel-art sprites cast shadows"></canvas></div>
  <div class="hud" id="hud">
    <div>
      <h1>Sprite Shadows</h1>
      <p>Gemini-generated pixel sprites casting real shadows. WASD or click to walk the knight.</p>
    </div>
    <div class="controls">
      <label for="sunAz">Sun angle <input id="sunAz" type="range" min="0" max="360" value="250"></label>
      <label for="sunEl">Sun height <input id="sunEl" type="range" min="8" max="75" value="28"></label>
      <button id="spinBtn" type="button" aria-pressed="false">Turn sun</button>
      <button id="ditherBtn" type="button" aria-pressed="true">Dither: on</button>
      <button id="artBtn" type="button" hidden>Art: generated</button>
    </div>
  </div>
</main>

  { const g = new THREE.BoxGeometry(1.8, 4.6, 1.1, 2, 3, 2); const pa = g.attributes.position; for (let i = 0; i < pa.count; i++) { pa.setX(i, pa.getX(i) * (1 + (rnd() - 0.5) * 0.15)); if (pa.getY(i) > 2) pa.setY(i, pa.getY(i) - Math.abs(pa.getX(i)) * 0.4); } g.computeVertexNormals();
    const s = new THREE.Mesh(g, stoneMat); s.position.set(-5, 2.1, -4); s.rotation.set(0, 0.4, 0.06); s.castShadow = s.receiveShadow = true; scene.add(s); }
  [[5, -7, 3.2], [6.6, -7.2, 2.1], [8.2, -7.1, 1.2], [3.4, -7.3, 1.6]].forEach(([x, z, h]) => { const b = new THREE.Mesh(new THREE.BoxGeometry(1.6, h, 1), stoneMat); b.position.set(x, h / 2, z); b.castShadow = b.receiveShadow = true; scene.add(b); });

  const ghostMat = new THREE.MeshBasicMaterial({ colorWrite: false, depthWrite: false, side: THREE.DoubleSide });
  const unitPlane = new THREE.PlaneGeometry(1, 1);
  const actors = [];
  function actor(sh, x, z) {
    const tex = sh.tex.clone();
    if (sh.clones) { sh.clones.push(tex); if (sh.ready) tex.needsUpdate = true; } else tex.needsUpdate = true;
    tex.repeat.set(1 / sh.n, 1);
    const W = sh.w * UPP, H = sh.h * UPP;
    const vis = new THREE.Mesh(unitPlane, new THREE.MeshLambertMaterial({ map: tex, alphaTest: 0.5, side: THREE.DoubleSide }));
    vis.scale.set(W, H, 1); vis.quaternion.copy(camera.quaternion);
    const shadow = new THREE.Mesh(unitPlane, ghostMat);
    shadow.scale.set(W, H, 1); shadow.castShadow = true;
    shadow.customDepthMaterial = new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking, map: tex, alphaTest: 0.5, side: THREE.DoubleSide });

  }

  let sunYaw = 0, casterYaw = 0;
  const BASE_YAW = Math.atan2(-camRight.z, camRight.x);
  function updateCasterYaw() {
    let d = sunYaw - BASE_YAW; d = Math.atan2(Math.sin(d), Math.cos(d));

  }
  const knight = actor(useGen && GEN.knight ? genSheet(GEN.knight) : sheet(KNIGHT), 0, 3);
  knight.walk = useGen && GEN.knight ? [1, 2, 3, 4, 5, 6, 7, 8] : [1, 0, 2, 0];
  const STEP = 1.5 * UPP;
  const pilgrim = actor(useGen && GEN.pilgrim ? genSheet(GEN.pilgrim) : sheet(PILGRIM), -3, -1);
  const genCrow = useGen && GEN.crow;
  const CROW_F = genCrow ? { peck: 1, fly: [2, 2] } : { peck: 2, fly: [1, 2] };
  const crowSheet = genCrow ? genSheet(GEN.crow) : sheet(CROW);
  const crows = [[2, -2], [3.2, -1.2], [1.4, -0.6], [4, -2.6], [2.6, 0.4]].map(([x, z]) => Object.assign(actor(crowSheet, x, z), { home: new THREE.Vector3(x, 0, z), seed: rnd() * 10, flying: 0 }));
  const genPine = useGen && GEN.pine ? genSheet(GEN.pine) : null;
  const pineSheets = genPine ? [genPine, genPine, genPine] : [sheet(pine(15, 26)), sheet(pine(19, 34)), sheet(pine(13, 22))];
  for (let i = 0; i < 26; i++) {
    let x, z; do { x = (rnd() - 0.5) * 50; z = (rnd() - 0.5) * 50; } while (Math.hypot(x, z) < 9);
    const p = actor(pineSheets[i % 3], x, z); if (genPine) p.frame = i % genPine.n; p.update();
  }

  const genRose = useGen && GEN.roses ? genSheet(GEN.roses) : null;
  const roseSheets = genRose ? Array.from({ length: genRose.n }, (_, f) => frameSheet(genRose, f)) : ROSES.map(r => sheet([r]));
  const roseSets = roseSheets.map((sh, si) => {
    const spots = [];
    for (let i = 0; i < 4000 && spots.length < (genRose ? 30 : 260); i++) { const x = (rnd() - 0.5) * 34, z = (rnd() - 0.5) * 34; if (fbm(x * 0.15 + si * 7, z * 0.15) > 0.58 && Math.hypot(x, z - 3) > 2.5) spots.push([x, z]); }
    const W = sh.w * UPP, H = sh.h * UPP;
    const vis = new THREE.InstancedMesh(unitPlane, new THREE.MeshLambertMaterial({ map: sh.tex, alphaTest: 0.5, side: THREE.DoubleSide }), spots.length);
    const sha = new THREE.InstancedMesh(unitPlane, ghostMat, spots.length);
    sha.castShadow = true; sha.frustumCulled = false; vis.frustumCulled = false;
    sha.customDepthMaterial = new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking, map: sh.tex, alphaTest: 0.5, side: THREE.DoubleSide });
    const m4 = new THREE.Matrix4(), s = new THREE.Vector3(W, H, 1), p = new THREE.Vector3();
    spots.forEach(([x, z], i) => { p.set(x, 0, z).addScaledVector(camUp, H / 2); m4.compose(p, camera.quaternion, s); vis.setMatrixAt(i, m4); });
    scene.add(vis, sha);
    return { spots, sha, W, H };
  });
  function updateRoseShadows() {
    const m4 = new THREE.Matrix4(), q = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), casterYaw), p = new THREE.Vector3();
    roseSets.forEach(r => { const s = new THREE.Vector3(r.W, r.H, 1); r.spots.forEach(([x, z], i) => { m4.compose(p.set(x, r.H / 2, z), q, s); r.sha.setMatrixAt(i, m4); }); r.sha.instanceMatrix.needsUpdate = true; });
  }

  const quadGeo = new THREE.PlaneGeometry(2, 2), orthoCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  const VERT = `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`;
  const ditherMat = new THREE.ShaderMaterial({
    uniforms: { tScene: { value: null }, uTime: { value: 0 }, uDither: { value: 1 } },
    vertexShader: VERT,
    fragmentShader: `
      precision highp float;
      varying vec2 vUv; uniform sampler2D tScene; uniform float uTime, uDither;
      float bayer2(vec2 a){ a = floor(a); return fract(dot(a, vec2(0.5, a.y * 0.75))); }
      float bayer4(vec2 a){ return bayer2(0.5 * a) * 0.25 + bayer2(a); }
      float bayer8(vec2 a){ return bayer4(0.5 * a) * 0.25 + bayer2(a); }
      float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
      float vnoise(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f); return mix(mix(hash(i), hash(i+vec2(1,0)), f.x), mix(hash(i+vec2(0,1)), hash(i+vec2(1,1)), f.x), f.y); }
      float fbm(vec2 p){ float v = 0.0, a = 0.5; for (int i = 0; i < 4; i++){ v += a * vnoise(p); p *= 2.03; a *= 0.5; } return v; }
      vec3 ramp(float t){ vec3 c = mix(vec3(0.065, 0.052, 0.07), vec3(0.94, 0.905, 0.83), t); return c + vec3(0.025, 0.0, 0.035) * sin(t * 3.14159); }
      vec3 redRamp(float t){ return mix(vec3(0.13, 0.015, 0.03), vec3(0.97, 0.2, 0.17), t); }
      void main(){

        float rose = step(0.5, (col.r - max(col.g, col.b)) / max(mx, 1e-4)) * step(0.004, mx);

  const ditherScene = new THREE.Scene(); ditherScene.add(new THREE.Mesh(quadGeo, ditherMat));
  const crtMat = new THREE.ShaderMaterial({
    uniforms: { tImg: { value: null }, uLow: { value: new THREE.Vector2(LOW, LOW) }, uTime: { value: 0 }, uBg: { value: new THREE.Color(0x0b090b) } },
    vertexShader: VERT,
    fragmentShader: `
      precision highp float;
      varying vec2 vUv; uniform sampler2D tImg; uniform vec2 uLow; uniform float uTime; uniform vec3 uBg;
      float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
      float sdRound(vec2 p, vec2 b, float r){ vec2 q = abs(p) - b + r; return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r; }

  const crtScene = new THREE.Scene(); crtScene.add(new THREE.Mesh(quadGeo, crtMat));
  const nearest = { minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter };
  const sceneRT = new THREE.WebGLRenderTarget(LOW, LOW, nearest), ditherRT = new THREE.WebGLRenderTarget(LOW, LOW, nearest);

  function fit() { const size = Math.max(200, Math.floor(Math.min(stage.clientWidth - 32, window.innerHeight - hud.offsetHeight - 44))); renderer.setSize(size, size, true); hud.style.maxWidth = size + 'px'; }
  window.addEventListener('resize', fit); fit();

  const sunAz = document.getElementById('sunAz'), sunEl = document.getElementById('sunEl'), spinBtn = document.getElementById('spinBtn'), ditherBtn = document.getElementById('ditherBtn');
  const artBtn = document.getElementById('artBtn');
  if (Object.keys(GEN).length) {
    artBtn.hidden = false; artBtn.textContent = 'Art: ' + (useGen ? 'generated' : 'hand-drawn');
    artBtn.addEventListener('click', () => { location.hash = useGen ? 'hand' : 'gen'; location.reload(); });
  }
  let spinning = false;
  spinBtn.addEventListener('click', () => { spinning = !spinning; spinBtn.setAttribute('aria-pressed', String(spinning)); spinBtn.textContent = spinning ? 'Stop sun' : 'Turn sun'; });
  ditherBtn.addEventListener('click', () => { const on = ditherMat.uniforms.uDither.value < 0.5; ditherMat.uniforms.uDither.value = on ? 1 : 0; ditherBtn.setAttribute('aria-pressed', String(on)); ditherBtn.textContent = 'Dither: ' + (on ? 'on' : 'off'); });
  const keys = new Set(); let walkTo = null;
  window.addEventListener('keydown', e => { if (/^(INPUT|BUTTON)$/.test(document.activeElement && document.activeElement.tagName) && e.code.startsWith('Arrow')) return; if (['KeyW', 'KeyA', 'KeyS', 'KeyD', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) { keys.add(e.code); walkTo = null; if (e.code.startsWith('Arrow')) e.preventDefault(); } });
  window.addEventListener('keyup', e => keys.delete(e.code));
  window.addEventListener('blur', () => keys.clear());
  const raycaster = new THREE.Raycaster(), ndc = new THREE.Vector2(), plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
  canvas.addEventListener('click', e => { const r = canvas.getBoundingClientRect(); ndc.set((e.clientX - r.left) / r.width * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1); raycaster.setFromCamera(ndc, camera); const hit = raycaster.ray.intersectPlane(plane, new THREE.Vector3()); if (hit) walkTo = hit; });

  const clock = new THREE.Clock();
  let lastSun = '';
  const fwd = new THREE.Vector3(-CAM_DIR.x, 0, -CAM_DIR.z).normalize(), right = new THREE.Vector3(camRight.x, 0, camRight.z).normalize();
  let knightDist = 0, pilgrimT = 0, pilgrimDist = 0;
  const PA = new THREE.Vector3(-6, 0, -1), PB = new THREE.Vector3(-1.5, 0, 0.6), PLEN = PA.distanceTo(PB), PSPEED = 0.9, PPAUSE = 2.5;
  function frame() {
    const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
    if (spinning && !reduceMotion) sunAz.value = (+sunAz.value + dt * 20) % 360;
    const az = +sunAz.value * Math.PI / 180, el = +sunEl.value * Math.PI / 180;
    const sunDir = new THREE.Vector3(Math.sin(az) * Math.cos(el), Math.sin(el), Math.cos(az) * Math.cos(el));
    sunYaw = Math.atan2(sunDir.x, sunDir.z); updateCasterYaw();
    const key = sunAz.value + '/' + sunEl.value;
    if (key !== lastSun) { lastSun = key; updateRoseShadows(); }

    const mv = new THREE.Vector3();
    const kf = (keys.has('KeyW') || keys.has('ArrowUp') ? 1 : 0) - (keys.has('KeyS') || keys.has('ArrowDown') ? 1 : 0);
    const kr = (keys.has('KeyD') || keys.has('ArrowRight') ? 1 : 0) - (keys.has('KeyA') || keys.has('ArrowLeft') ? 1 : 0);
    if (kf || kr) mv.addScaledVector(fwd, kf).addScaledVector(right, kr);
    else if (walkTo) { mv.set(walkTo.x - knight.pos.x, 0, walkTo.z - knight.pos.z); if (mv.length() < 0.15) { walkTo = null; mv.set(0, 0, 0); } }
    if (mv.lengthSq() > 0) {
      mv.normalize(); knight.pos.addScaledVector(mv, dt * 2.4); knightDist += dt * 2.4;
      knight.pos.x = Math.max(-24, Math.min(24, knight.pos.x)); knight.pos.z = Math.max(-24, Math.min(24, knight.pos.z));
      const sx = mv.dot(right); if (Math.abs(sx) > 0.05) knight.flip = sx < 0;
      knight.frame = knight.walk[Math.floor(knightDist / STEP) % knight.walk.length];
    } else { knight.frame = 0; knightDist = 0; }

    pilgrimT += dt;

    const leg = PLEN / PSPEED, cyc = 2 * (leg + PPAUSE), c = pilgrimT % cyc;
    let u, moving = true;
    if (c < leg) u = c / leg; else if (c < leg + PPAUSE) { u = 1; moving = false; }
    else if (c < 2 * leg + PPAUSE) u = 1 - (c - leg - PPAUSE) / leg; else { u = 0; moving = false; }
    const prevX = pilgrim.pos.clone(); pilgrim.pos.lerpVectors(PA, PB, u);
    const pdx = pilgrim.pos.clone().sub(prevX);
    if (moving) { pilgrimDist += pdx.length(); const sx = pdx.dot(right); if (Math.abs(sx) > 1e-5) pilgrim.flip = sx < 0; }
    pilgrim.frame = moving && pilgrim.sh.n > 2 ? 1 + Math.floor(pilgrimDist / STEP) % (pilgrim.sh.n - 1) : (moving ? Math.floor(t * 3) % pilgrim.sh.n : 0);

    crows.forEach(c => {
      const near = knight.pos.distanceTo(c.home) < 2.8;
      c.flying = Math.max(0, Math.min(1, c.flying + (near ? dt * 1.5 : -dt * 0.5)));
      const f = sm(c.flying);
      c.pos.set(c.home.x + Math.sin(c.seed) * f * 4, 0, c.home.z + Math.cos(c.seed) * f * 4);
      c.lift = f * (2.5 + Math.sin(t * 3 + c.seed) * 0.3);
      c.frame = c.flying > 0.05 ? CROW_F.fly[Math.floor(t * 10 + c.seed) % 2] : (Math.sin(t * 2 + c.seed * 5) > 0.7 ? CROW_F.peck : 0);
      c.flip = Math.sin(c.seed) < 0;
    });

    camTarget.lerp(new THREE.Vector3(knight.pos.x * 0.6, 0, knight.pos.z * 0.6), Math.min(1, dt * 2));

    const snap = UPP, cx = Math.round(camTarget.dot(camRight) / snap) * snap, cy = Math.round(camTarget.dot(camUp) / snap) * snap;
    const snapped = camTarget.clone().addScaledVector(camRight, cx - camTarget.dot(camRight)).addScaledVector(camUp, cy - camTarget.dot(camUp));
    camera.position.copy(snapped).addScaledVector(CAM_DIR, 60); camera.lookAt(snapped);

    sun.position.copy(snapped).addScaledVector(sunDir, 70); sun.target.position.copy(snapped); sun.target.updateMatrixWorld();

    ditherMat.uniforms.uTime.value = t; crtMat.uniforms.uTime.value = t;
    renderer.setRenderTarget(sceneRT); renderer.setClearColor(BG, 1); renderer.clear(); renderer.render(scene, camera);
    ditherMat.uniforms.tScene.value = sceneRT.texture;
    renderer.setRenderTarget(ditherRT); renderer.clear(); renderer.render(ditherScene, orthoCam);
    crtMat.uniforms.tImg.value = ditherRT.texture;
    renderer.setRenderTarget(null); renderer.setClearColor(0x0b090b, 1); renderer.clear(); renderer.render(crtScene, orthoCam);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
