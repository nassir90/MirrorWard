<title>Dither Scene Studies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=UnifrakturMaguntia&display=swap">
<style>

  :root {
    --ground: #0b090b;
    --ink: #e9e1d2;
    --dim: #8c8078;
    --line: #3a3236;
    --glow: #f3ead8;
    --font-ui: "Pixelify Sans", ui-monospace, "SF Mono", Menlo, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { background: var(--ground); color: var(--ink); font-family: var(--font-ui); overflow: hidden; }
  .stage { height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding-inline: 16px; padding-block: 12px; }
  .frame { line-height: 0; max-width: 100%; }
  canvas { display: block; max-width: 100%; touch-action: none; cursor: grab; }
  .hud { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 20px; width: 100%; box-sizing: border-box; }
  .hud h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: 0.04em; }
  .hud p { margin: 2px 0 0; font-size: 13px; color: var(--dim); }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button, select { font: inherit; font-size: 14px; color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 0; padding: 6px 12px; cursor: pointer; }
  select option { background: var(--ground); color: var(--ink); }
  button:hover, select:hover { border-color: var(--dim); }
  button:focus-visible, select:focus-visible { outline: 2px solid var(--glow); outline-offset: 2px; }
</style>

<main class="stage" id="stage">
  <div class="frame"><canvas id="view" aria-label="Dithered replica of a scene"></canvas></div>
  <div class="hud" id="hud">
    <div>
      <h1 id="sceneName">Dither Scene Studies</h1>
      <p id="sceneNote">Nine scenes rebuilt in the dithered CRT style. Drag to look around.</p>
    </div>
    <div class="controls">
      <button id="prevBtn" type="button" aria-label="Previous scene">&lt;</button>
      <select id="sceneSel" aria-label="Scene"></select>
      <button id="nextBtn" type="button" aria-label="Next scene">&gt;</button>
      <button id="ditherBtn" type="button" aria-pressed="true">Dither: on</button>
    </div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  const canvas = document.getElementById('view');
  const stage = document.getElementById('stage');
  const hud = document.getElementById('hud');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  let rnd = mulberry32(7);
  const h2 = (x, z) => { const s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453; return s - Math.floor(s); };
  const sm = t => t * t * (3 - 2 * t);
  function vnoise(x, z) {
    const ix = Math.floor(x), iz = Math.floor(z), fx = sm(x - ix), fz = sm(z - iz);
    const a = h2(ix, iz), b = h2(ix + 1, iz), c = h2(ix, iz + 1), d = h2(ix + 1, iz + 1);
    return a + (b - a) * fx + (c - a) * fz + (a - b - c + d) * fx * fz;
  }
  const fbm = (x, z) => vnoise(x, z) * 0.5 + vnoise(x * 2.03, z * 2.03) * 0.25 + vnoise(x * 4.1, z * 4.1) * 0.125 + vnoise(x * 8.2, z * 8.2) * 0.0625;
  const smoothstep = (a, b, x) => { const t = Math.max(0, Math.min(1, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

  const std = (color, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness: 1, metalness: 0, flatShading: true, ...extra });
  const timeU = { value: 0 };
  function shadowed(o) { o.traverse(m => { if (m.isMesh) { m.castShadow = true; m.receiveShadow = true; } }); return o; }

  function newScene(bg, fogDensity) {
    const s = new THREE.Scene();
    s.userData.bg = new THREE.Color(bg);
    if (fogDensity) s.fog = new THREE.FogExp2(bg, fogDensity);
    return s;
  }
  function hemi(s, k) { s.add(new THREE.HemisphereLight(0xa8a2b0, 0x241e24, k)); }
  function sun(s, p, k, size) {
    const l = new THREE.DirectionalLight(0xf0ecf4, k);
    l.position.set(...p);
    l.castShadow = true; l.shadow.mapSize.set(2048, 2048);
    Object.assign(l.shadow.camera, { left: -size, right: size, top: size, bottom: -size, near: 1, far: 200 });
    l.shadow.bias = -0.0012;
    s.add(l, l.target); return l;
  }
  function ground(o) {
    const { size = 140, seg = 90, c1 = 0xe6e1d8, c2 = 0xa39c96, scale = 0.09, lo = 0.45, hi = 0.75, amp = 0.2, y = 0, cx = 0, cz = 0 } = o || {};
    const g = new THREE.PlaneGeometry(size, size, seg, seg); g.rotateX(-Math.PI / 2);
    const p = g.attributes.position, col = new Float32Array(p.count * 3);
    const A = new THREE.Color(c1), B = new THREE.Color(c2), c = new THREE.Color();
    for (let i = 0; i < p.count; i++) {
      const x = p.getX(i) + cx, z = p.getZ(i) + cz, n = fbm(x * scale, z * scale);
      p.setY(i, (n - 0.5) * amp * 2);
      c.copy(A).lerp(B, smoothstep(lo, hi, n)); col.set([c.r, c.g, c.b], i * 3);
    }
    g.setAttribute('color', new THREE.BufferAttribute(col, 3)); g.computeVertexNormals();
    const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1, flatShading: true }));
    m.position.set(cx, y, cz); m.receiveShadow = true; return m;
  }
  function pine(x, z, h = 3) {
    const g = new THREE.Group(), mat = std(0x262a26);
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.14, h * 0.3, 5), std(0x2a2224)); trunk.position.y = h * 0.15; g.add(trunk);
    [[0.3, 0.42, 0.28], [0.23, 0.36, 0.52], [0.14, 0.3, 0.74]].forEach(([r, hh, y]) => {
      const c = new THREE.Mesh(new THREE.ConeGeometry(r * h, hh * h, 7), mat); c.position.y = y * h; g.add(c);
    });
    g.position.set(x, 0, z); g.rotation.y = rnd() * 6; return shadowed(g);
  }
  function roofGeo(w, h, d) {
    const s = new THREE.Shape(); s.moveTo(-w / 2, 0); s.lineTo(w / 2, 0); s.lineTo(0, h); s.lineTo(-w / 2, 0);
    const g = new THREE.ExtrudeGeometry(s, { depth: d, bevelEnabled: false }); g.translate(0, 0, -d / 2); return g;
  }
  function figure(x, z, s = 1) {
    const g = new THREE.Group(), m = std(0x1c181a);
    const b = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.26, 1.1, 6), m); b.position.y = 0.55; g.add(b);
    const hd = new THREE.Mesh(new THREE.SphereGeometry(0.17, 6, 4), m); hd.position.y = 1.25; g.add(hd);
    g.position.set(x, 0, z); g.scale.setScalar(s); return shadowed(g);
  }
  function windify(mat) {
    mat.onBeforeCompile = s => {
      s.uniforms.uTime = timeU;
      s.vertexShader = 'uniform float uTime;\n' + s.vertexShader.replace('#include <begin_vertex>', `#include <begin_vertex>
        #ifdef USE_INSTANCING
          vec3 ip = vec3(instanceMatrix[3][0], instanceMatrix[3][1], instanceMatrix[3][2]);
          float hh = max(position.y, 0.0);
          transformed.x += sin(uTime * 1.6 + ip.x * 0.35 + ip.z * 0.22) * 0.1 * hh;
        #endif`);
    };
    return mat;
  }

  function makeKnight(scale = 1) {
    const knight = new THREE.Group();
    const steel = std(0xa4a4aa), steelDark = std(0x5c5c62), cloth = std(0x2c2829), leather = std(0x3b3530);
    const part = (geo, mat, x, y, z, parent) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); (parent || knight).add(m); return m; };
    const HIP = 0.85;
    const legs = [-1, 1].map(sx => {
      const g = new THREE.Group(); g.position.set(sx * 0.15, HIP, 0); knight.add(g);
      part(new THREE.BoxGeometry(0.19, 0.48, 0.21), steelDark, 0, -0.24, 0, g);
      part(new THREE.BoxGeometry(0.18, 0.4, 0.2), steel, 0, -0.62, 0, g);
      part(new THREE.BoxGeometry(0.2, 0.1, 0.32), steelDark, 0, -0.8, 0.05, g);
      return g;
    });
    part(new THREE.CylinderGeometry(0.3, 0.37, 0.34, 8), cloth, 0, HIP + 0.02, 0);
    part(new THREE.BoxGeometry(0.58, 0.08, 0.38), leather, 0, HIP + 0.16, 0);
    part(new THREE.BoxGeometry(0.56, 0.6, 0.36), steel, 0, HIP + 0.48, 0);
    part(new THREE.CylinderGeometry(0.17, 0.19, 0.32, 8), steel, 0, HIP + 0.96, 0);
    part(new THREE.SphereGeometry(0.17, 8, 4, 0, Math.PI * 2, 0, Math.PI / 2), steel, 0, HIP + 1.12, 0);
    part(new THREE.BoxGeometry(0.05, 0.16, 0.34), cloth, 0, HIP + 1.3, -0.04);
    const cape = part(new THREE.PlaneGeometry(0.62, 1.15), new THREE.MeshStandardMaterial({ color: 0x242022, roughness: 1, flatShading: true, side: THREE.DoubleSide }), 0, HIP + 0.2, -0.22);
    const arms = [-1, 1].map(sx => {
      const g = new THREE.Group(); g.position.set(sx * 0.37, HIP + 0.68, 0); knight.add(g);
      part(new THREE.SphereGeometry(0.17, 6, 4), steel, 0, 0.02, 0, g);
      part(new THREE.BoxGeometry(0.15, 0.36, 0.15), steelDark, 0, -0.22, 0, g);
      part(new THREE.BoxGeometry(0.14, 0.32, 0.14), steel, 0, -0.52, 0, g);
      return g;
    });
    part(new THREE.BoxGeometry(0.07, 0.62, 0.46), steelDark, -0.11, -0.46, 0.04, arms[0]);
    const sword = new THREE.Group(); sword.position.set(0, -0.7, 0.04); sword.rotation.x = 0.35; arms[1].add(sword);
    part(new THREE.BoxGeometry(0.26, 0.04, 0.05), steelDark, 0, -0.09, 0, sword);
    part(new THREE.BoxGeometry(0.06, 0.86, 0.02), std(0xc8c8cc), 0, -0.53, 0, sword);
    knight.scale.setScalar(scale);
    shadowed(knight);
    let phase = 0;
    knight.userData.pose = (moving, dt) => {
      if (moving) phase += dt * 8;
      const sw = moving ? Math.sin(phase) : 0;
      legs[0].rotation.x = sw * 0.7; legs[1].rotation.x = -sw * 0.7;
      arms[0].rotation.x = -sw * 0.35; arms[1].rotation.x = sw * 0.5;
      cape.rotation.x = 0.1 + (moving ? 0.35 : 0);
    };
    return knight;
  }

  function wander(k, a, b, speed = 1.2) {
    const A = new THREE.Vector3(...a), B = new THREE.Vector3(...b), len = A.distanceTo(B);
    const leg = len / speed, pause = 1.5, cycle = 2 * (leg + pause);
    return t => {
      const c = t % cycle; let u, dir, moving = true;
      if (c < leg) { u = c / leg; dir = 1; } else if (c < leg + pause) { u = 1; dir = 1; moving = false; }
      else if (c < 2 * leg + pause) { u = 1 - (c - leg - pause) / leg; dir = -1; } else { u = 0; dir = -1; moving = false; }
      k.position.lerpVectors(A, B, u);
      const d = B.clone().sub(A).multiplyScalar(dir);
      k.rotation.y = Math.atan2(d.x, d.z);
      k.userData.pose(moving, 1 / 60);
    };
  }

  const SCENES = [
    {
      name: 'Chasm edge', note: 'A traveller on a pale plateau above a misty drop, in sleet.',
      rain: 1, mist: 0.35, exposure: 1.05, cloud: 0.6,
      build() {
        const s = newScene(0x1c181b, 0.006);
        hemi(s, 0.55); sun(s, [-14, 30, 6], 1.1, 40);
        s.add(ground({ size: 160, c1: 0x3c363a, c2: 0x201c20, y: -34, amp: 2, scale: 0.05 }));

        const sh = new THREE.Shape();
        const edge = z => -0.5 + Math.sin(z * 0.23) * 0.7 + (h2(Math.round(z), 3) - 0.5) * 0.5;
        sh.moveTo(edge(-40), -40);
        for (let z = -39; z <= 40; z++) sh.lineTo(edge(z), z);
        sh.lineTo(60, 40); sh.lineTo(60, -40);
        const g = new THREE.ExtrudeGeometry(sh, { depth: 34, bevelEnabled: false }); g.rotateX(Math.PI / 2);
        const tex = noiseTexture(0xe4dfd6, 0x6e666a, 0.62);
        tex.repeat.set(1 / 24, 1 / 24);
        const plateau = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ map: tex, roughness: 1 }));
        plateau.receiveShadow = true; plateau.castShadow = true; s.add(plateau);

        for (let i = 0; i < 16; i++) {
          const d = new THREE.Mesh(new THREE.CircleGeometry(0.3 + rnd() * 0.5, 7), std(0x7a7276));
          d.rotation.x = -Math.PI / 2; d.position.set(5 + (rnd() - 0.5) * 1.5, 0.02, -18 + i * 2.2 + rnd()); d.scale.x = 0.7; s.add(d);
        }
        const k = makeKnight(1.1); s.add(k);
        s.add(figure(1.4, 3.4, 0.35));
        return { scene: s, cam: { pos: [-1.6, 30, 0.6], target: [-1.6, 0, 0], fov: 42 }, update: wander(k, [3.2, 0, 1], [3.2, 0, 4], 0.7) };
      }
    },
    {
      name: 'Tower in the flowers', note: 'A stone tower rising out of a carpet of red flowers.',
      rain: 0, mist: 0.08, exposure: 1.1, cloud: 0.7,
      build() {
        rnd = mulberry32(11);
        const s = newScene(0x6a6468, 0.006);
        hemi(s, 1.0); sun(s, [-10, 30, 14], 0.6, 40);
        s.add(ground({ c1: 0xc6c0b8, c2: 0x6e6864, scale: 0.12, lo: 0.4, hi: 0.7 }));
        const stone = std(0x9e968e), R = 3.2, H = 16;
        const body = new THREE.Mesh(new THREE.CylinderGeometry(R, R * 1.03, H, 16, 4), stone); body.position.y = H / 2; s.add(body);
        const ring = new THREE.Mesh(new THREE.CylinderGeometry(R + 0.3, R + 0.3, 0.8, 16), std(0x7e7670)); ring.position.y = H - 0.4; s.add(ring);
        const cap = new THREE.Mesh(new THREE.CylinderGeometry(R + 0.2, R + 0.2, 0.3, 16), std(0x6e666a)); cap.position.y = H + 0.1; s.add(cap);
        const dark = std(0x141214);
        for (let i = 0; i < 26; i++) {
          const a = rnd() * Math.PI * 2, y = 2.5 + rnd() * (H - 4.5);
          const w = new THREE.Mesh(new THREE.BoxGeometry(0.6 + rnd() * 0.9, 0.5 + rnd() * 0.9, 0.3), dark);
          w.position.set(Math.sin(a) * (R - 0.05), y, Math.cos(a) * (R - 0.05)); w.rotation.y = a; s.add(w);
        }
        const door = new THREE.Mesh(new THREE.BoxGeometry(1.3, 2.4, 0.3), dark); door.position.set(0, 1.2, R); s.add(door);
        shadowed(s);

        const bushGeo = new THREE.IcosahedronGeometry(0.34, 0); bushGeo.scale(1, 0.7, 1); bushGeo.translate(0, 0.2, 0);
        const bloomGeo = new THREE.DodecahedronGeometry(0.12, 0);
        const spots = [];
        for (let i = 0; i < 60000 && spots.length < 13000; i++) {
          const a = rnd() * 6.283, r = R + 0.8 + Math.sqrt(rnd()) * 28, x = Math.cos(a) * r, z = Math.sin(a) * r;
          if (fbm(x * 0.12 + 5, z * 0.12) < 0.3 + rnd() * 0.12) continue;
          spots.push([x, z]);
        }
        const bushes = new THREE.InstancedMesh(bushGeo, windify(std(0x5e605a)), spots.length);
        const blooms = new THREE.InstancedMesh(bloomGeo, windify(std(0xd0101c)), spots.length * 3);
        const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), p = new THREE.Vector3(), sc = new THREE.Vector3();
        let bi = 0;
        spots.forEach(([x, z], i) => {
          const k = 0.7 + rnd() * 0.6;
          m4.compose(p.set(x, 0, z), q.setFromEuler(e.set(0, rnd() * 6, 0)), sc.set(k, k, k)); bushes.setMatrixAt(i, m4);
          const n = 1 + Math.floor(rnd() * 3);
          for (let j = 0; j < n; j++) {
            const ba = rnd() * 6.28, br = rnd() * 0.3 * k;
            m4.compose(p.set(x + Math.cos(ba) * br, (0.36 + rnd() * 0.1) * k, z + Math.sin(ba) * br), q.setFromEuler(e.set(rnd(), rnd() * 6, rnd())), sc.set(1, 1, 1));
            blooms.setMatrixAt(bi++, m4);
          }
        });
        blooms.count = bi;
        [bushes, blooms].forEach(m => { m.castShadow = true; m.receiveShadow = true; s.add(m); });
        const k = makeKnight(0.9); s.add(k);
        return { scene: s, cam: { pos: [0, 27, 15], target: [0, 3.5, 2], fov: 42 }, update: wander(k, [2.5, 0, 6], [-2.5, 0, 7.5], 1.0) };
      }
    },
    {
      name: 'Burning hut', note: 'A cabin burns on a snowy plain; smoke drifts over the pines.',
      rain: 1, mist: 0.25, exposure: 1.0, cloud: 0.9,
      build() {
        rnd = mulberry32(21);
        const s = newScene(0x5a5458, 0.008);
        hemi(s, 0.7); sun(s, [-22, 14, 6], 1.2, 40);
        s.add(ground({ c1: 0xe8e3da, c2: 0xa8a09a, scale: 0.1 }));
        const hut = new THREE.Group();
        const walls = new THREE.Mesh(new THREE.BoxGeometry(2.6, 1.5, 2.2), std(0x5a4e4c)); walls.position.y = 0.75; hut.add(walls);
        const roof = new THREE.Mesh(roofGeo(3.0, 1.3, 2.6), std(0x2a2224)); roof.position.y = 1.5; roof.rotation.y = Math.PI / 2; roof.rotation.z = 0.12; hut.add(roof);
        const dr = new THREE.Mesh(new THREE.BoxGeometry(0.6, 1, 0.1), std(0x141214)); dr.position.set(0.4, 0.5, 1.12); hut.add(dr);
        shadowed(hut); s.add(hut);
        const fires = [];
        for (let i = 0; i < 7; i++) {
          const f = new THREE.Mesh(new THREE.IcosahedronGeometry(0.5 + rnd() * 0.45, 0), new THREE.MeshBasicMaterial({ color: 0xffffff, fog: false }));
          f.position.set((rnd() - 0.5) * 2.2, 1.7 + rnd() * 2.2, (rnd() - 0.5) * 1.8); f.userData.seed = rnd() * 10; s.add(f); fires.push(f);
        }
        const glow = new THREE.PointLight(0xfff0d8, 2.2, 14, 1.4); glow.position.set(0, 2.5, 0.5); s.add(glow);
        const smokeMat = new THREE.MeshBasicMaterial({ color: 0x1e1a1c });
        const puffs = [];
        for (let i = 0; i < 70; i++) {
          const p = new THREE.Mesh(new THREE.IcosahedronGeometry(1, 1), smokeMat); p.userData.u = i / 70; p.userData.j = [rnd() - 0.5, rnd() - 0.5, rnd() - 0.5]; s.add(p); puffs.push(p);
        }
        [[-7, -4, 3.2], [8, -8, 3], [-5, 9, 2.8], [7, 7, 3.2], [11, -1, 2.4]].forEach(([x, z, h]) => s.add(pine(x, z, h)));
        const k = makeKnight(0.8); s.add(k);
        s.add(figure(3.8, 1.2, 0.8)); s.add(figure(4.4, 2.0, 0.75));
        const walk = wander(k, [2.5, 0, 3], [1, 0, 4.5], 0.8);
        return {
          scene: s, cam: { pos: [0, 22, 21], target: [0, 1, -1], fov: 46 },
          ray: { meshes: fires, strength: 0.9 },
          update(t) {
            walk(t);
            fires.forEach(f => f.scale.setScalar(0.7 + 0.35 * Math.abs(Math.sin(t * 6 + f.userData.seed))));
            glow.intensity = 2 + Math.sin(t * 11) * 0.3;
            puffs.forEach(p => {
              const u = (p.userData.u + t * 0.04) % 1, j = p.userData.j;
              p.position.set(1.5 + u * 3 + j[0] * (1 + u * 3), 4 + u * 7 + j[1] * 2, -4 - u * 5 + j[2] * (1 + u * 3));
              p.scale.setScalar(0.5 + u * 2.3);
            });
          }
        };
      }
    },
    {
      name: 'Wedding band', note: 'The hand inventory: a worn ring on the medicine finger.',
      rain: 0, mist: 0.06, exposure: 1.0, ui: true,
      build() {
        const s = newScene(0x2e282a, 0);
        hemi(s, 0.3);
        const key = new THREE.DirectionalLight(0xffffff, 1.35); key.position.set(4, 5, 7); key.castShadow = true;
        Object.assign(key.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6, near: 1, far: 30 }); key.shadow.mapSize.set(1024, 1024); s.add(key);
        const backdrop = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), std(0x2e282a)); backdrop.position.z = -3; s.add(backdrop);
        const skinTex = noiseTexture(0xd6cfc6, 0x6a6264, 0.5); skinTex.repeat.set(2, 2);
        const skin = new THREE.MeshStandardMaterial({ map: skinTex, roughness: 1, flatShading: true });
        const hand = new THREE.Group();
        const palm = new THREE.Mesh(new THREE.BoxGeometry(1.75, 1.75, 0.5, 3, 3, 1), skin); hand.add(palm);
        { const pp = palm.geometry.attributes.position; for (let i = 0; i < pp.count; i++) { const y = pp.getY(i); pp.setX(i, pp.getX(i) * (1 - Math.max(0, -y) * 0.14)); } palm.geometry.computeVertexNormals(); }
        const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.66, 0.78, 5, 10), skin); arm.scale.z = 0.5; arm.position.set(-0.1, -3.3, 0); arm.rotation.z = 0.06; hand.add(arm);
        const fingers = [[-0.66, 1.3, 0.2, 0.17], [-0.22, 1.7, 0.08, 0.2], [0.22, 1.85, -0.04, 0.2], [0.64, 1.6, -0.16, 0.19]];

          l += acc / float(N) * 2.2 * uRay;
        }
        float cl = fbm(vUv * 1.7 + vec2(uTime * 0.012, 3.0));
        l *= 1.0 - smoothstep(0.35, 0.72, cl) * uCloud * 0.4;
        float mist = fbm(vUv * vec2(3.0, 5.0) + vec2(uTime * 0.02, uTime * 0.008));
        l += smoothstep(0.45, 0.85, mist) * uMist * 0.3;
        if (rose < 0.5) {
          l = mix(l, l * 0.5, sleet(gl_FragCoord.xy) * uRain);
          l = max(l, flakes(gl_FragCoord.xy) * uSnow * 0.97);
        }
        l += (hash(gl_FragCoord.xy + fract(uTime * 7.0) * 91.0) - 0.5) * 0.035;
        l = clamp(l, 0.0, 1.0);
        float lv = rose > 0.5 ? 4.0 : uLevels, t;
        if (uDither > 0.5) { float v = l * (lv - 1.0); t = (floor(v) + step(bayer8(gl_FragCoord.xy), fract(v))) / (lv - 1.0); }
        else t = l;
        gl_FragColor = vec4(rose > 0.5 ? redRamp(t) : ramp(t), 1.0);
      }`
  });
  const ditherScene = new THREE.Scene(); ditherScene.add(new THREE.Mesh(quadGeo, ditherMat));
  const crtMat = new THREE.ShaderMaterial({
    uniforms: { tImg: { value: null }, tUI: { value: uiTex }, uUI: { value: 0 }, uLow: { value: new THREE.Vector2(256, 256) }, uTime: { value: 0 }, uBg: { value: new THREE.Color(0x0b090b) } },
    vertexShader: VERT,
    fragmentShader: `
      precision highp float;
      varying vec2 vUv;
      uniform sampler2D tImg, tUI; uniform vec2 uLow; uniform float uTime, uUI; uniform vec3 uBg;
      float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
      float sdRound(vec2 p, vec2 b, float r){ vec2 q = abs(p) - b + r; return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r; }
      void main(){
        vec2 c = vUv * 2.0 - 1.0;
        float mask = 1.0 - smoothstep(-0.004, 0.004, sdRound(c, vec2(0.985), 0.07));
        vec2 uv = (c * (1.0 + 0.045 * dot(c, c)) / 1.07) * 0.5 + 0.5;
        vec3 col = texture2D(tImg, uv).rgb, blur = vec3(0.0);
        vec2 px = 1.25 / uLow;
        blur += texture2D(tImg, uv + vec2( px.x, 0.0)).rgb; blur += texture2D(tImg, uv + vec2(-px.x, 0.0)).rgb;
        blur += texture2D(tImg, uv + vec2(0.0,  px.y)).rgb; blur += texture2D(tImg, uv + vec2(0.0, -px.y)).rgb;
        blur += texture2D(tImg, uv + px).rgb; blur += texture2D(tImg, uv - px).rgb;
        blur += texture2D(tImg, uv + vec2(px.x, -px.y)).rgb; blur += texture2D(tImg, uv + vec2(-px.x, px.y)).rgb;
        blur /= 8.0;
        col = mix(col, blur, 0.3) + smoothstep(0.55, 0.95, blur) * 0.12;
        vec4 ui = texture2D(tUI, uv);
        col = mix(col, ui.rgb, ui.a * uUI);
        col *= mix(0.28, 1.0, smoothstep(1.55, 0.35, length(c * vec2(1.0, 1.05))));
        col += (hash(vUv * 900.0 + fract(uTime) * 37.0) - 0.5) * 0.045;
        col *= 0.97 + 0.03 * sin(uTime * 50.0);
        gl_FragColor = vec4(mix(uBg, col, mask), 1.0);
      }`
  });
  const crtScene = new THREE.Scene(); crtScene.add(new THREE.Mesh(quadGeo, crtMat));

  const LOW = 256;
  const nearest = { minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter };
  const sceneRT = new THREE.WebGLRenderTarget(LOW, LOW, nearest);
  const occRT = new THREE.WebGLRenderTarget(LOW >> 1, LOW >> 1, { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter });
  const ditherRT = new THREE.WebGLRenderTarget(LOW, LOW, nearest);
  crtMat.uniforms.uLow.value.set(LOW, LOW);
  const blackMat = new THREE.MeshBasicMaterial({ color: 0x000000 }), whiteMat = new THREE.MeshBasicMaterial({ color: 0xffffff });

  function fit() {
    const size = Math.max(200, Math.floor(Math.min(stage.clientWidth - 32, window.innerHeight - hud.offsetHeight - 50)));
    renderer.setSize(size, size, true); hud.style.maxWidth = size + 'px';
  }
  window.addEventListener('resize', fit); fit();

  const built = [];
  let cur = 0, az = 0, azT = 0;
  const sel = document.getElementById('sceneSel');
  SCENES.forEach((d, i) => { const o = document.createElement('option'); o.value = i; o.textContent = (i + 1) + '. ' + d.name; sel.appendChild(o); });
  function setScene(i) {
    cur = (i + SCENES.length) % SCENES.length;
    if (!built[cur]) {
      built[cur] = SCENES[cur].build();
      const r = built[cur].ray;
      if (r) { r.occ = new THREE.Scene(); r.clones = r.meshes.map(m => { const c = new THREE.Mesh(m.geometry, whiteMat); c.matrixAutoUpdate = false; r.occ.add(c); return c; }); }
    }
    const d = SCENES[cur];
    sel.value = cur;
    document.getElementById('sceneName').textContent = d.name;
    document.getElementById('sceneNote').textContent = d.note + ' Drag to look around.';
    const u = ditherMat.uniforms;
    u.uRain.value = d.rain || 0; u.uSnow.value = d.snow || 0; u.uMist.value = d.mist || 0; u.uExposure.value = d.exposure || 1; u.uCloud.value = d.cloud || 0; crtMat.uniforms.uUI.value = d.ui ? 1 : 0;
    azT = 0;
    try { history.replaceState(null, '', '#s' + (cur + 1)); } catch (e) {}
  }
  sel.addEventListener('change', () => setScene(+sel.value));
  document.getElementById('prevBtn').addEventListener('click', () => setScene(cur - 1));
  document.getElementById('nextBtn').addEventListener('click', () => setScene(cur + 1));
  const ditherBtn = document.getElementById('ditherBtn');
  ditherBtn.addEventListener('click', () => {
    const on = ditherMat.uniforms.uDither.value < 0.5; ditherMat.uniforms.uDither.value = on ? 1 : 0;
    ditherBtn.setAttribute('aria-pressed', String(on)); ditherBtn.textContent = 'Dither: ' + (on ? 'on' : 'off');
  });
  window.addEventListener('keydown', e => {
    if (/^(SELECT|INPUT)$/.test(document.activeElement && document.activeElement.tagName)) return;
    if (e.code === 'ArrowRight') setScene(cur + 1); if (e.code === 'ArrowLeft') setScene(cur - 1);
  });
  let drag = false, lx = 0;
  canvas.addEventListener('pointerdown', e => { drag = true; lx = e.clientX; canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener('pointermove', e => { if (!drag) return; azT = Math.max(-0.8, Math.min(0.8, azT - (e.clientX - lx) * 0.005)); lx = e.clientX; });
  canvas.addEventListener('pointerup', () => { drag = false; });

  const tmp = new THREE.Vector3(), off = new THREE.Vector3();
  function renderAt(t, dt) {
    const b = built[cur], d = SCENES[cur];
    timeU.value = reduceMotion ? 0 : t;
    if (b.update) b.update(reduceMotion ? 0 : t, dt);
    az += (azT - az) * Math.min(1, dt * 4);
    const idle = reduceMotion ? 0 : Math.sin(t * 0.07) * 0.04;
    const T = new THREE.Vector3(...b.cam.target);
    off.set(...b.cam.pos).sub(T).applyAxisAngle(new THREE.Vector3(0, 1, 0), az + idle);
    camera.fov = b.cam.fov; camera.updateProjectionMatrix();
    camera.position.copy(T).add(off); camera.lookAt(T);
    b.scene.updateMatrixWorld();

    const u = ditherMat.uniforms;
    u.uTime.value = t; crtMat.uniforms.uTime.value = t;
    renderer.setRenderTarget(occRT); renderer.setClearColor(0x000000, 1); renderer.clear();
    if (b.ray) {
      b.scene.overrideMaterial = blackMat; b.ray.meshes.forEach(m => m.visible = false);
      renderer.render(b.scene, camera);
      b.scene.overrideMaterial = null; b.ray.meshes.forEach(m => m.visible = true);
      b.ray.clones.forEach((c, i) => c.matrix.copy(b.ray.meshes[i].matrixWorld));
      renderer.render(b.ray.occ, camera);
      tmp.set(0, 0, 0); b.ray.meshes.forEach(m => tmp.add(m.getWorldPosition(new THREE.Vector3()))); tmp.multiplyScalar(1 / b.ray.meshes.length).project(camera);
      u.uLight.value.set(tmp.x * 0.5 + 0.5, tmp.y * 0.5 + 0.5); u.uRay.value = b.ray.strength;
    } else u.uRay.value = 0;

    renderer.setRenderTarget(sceneRT); renderer.setClearColor(b.scene.userData.bg, 1); renderer.clear();
    renderer.render(b.scene, camera);
    u.tScene.value = sceneRT.texture; u.tOcc.value = occRT.texture;
    renderer.setRenderTarget(ditherRT); renderer.clear(); renderer.render(ditherScene, orthoCam);
    crtMat.uniforms.tImg.value = ditherRT.texture;
    renderer.setRenderTarget(null); renderer.setClearColor(0x0b090b, 1); renderer.clear(); renderer.render(crtScene, orthoCam);
  }

  window.__studies = { count: SCENES.length, still(i, t) { setScene(i); renderAt(t, 1); renderAt(t, 1); } };

  const clock = new THREE.Clock();
  let paused = false;
  window.__studies.pause = p => { paused = p; };
  function loop() { const dt = Math.min(clock.getDelta(), 0.05); if (!paused) renderAt(clock.elapsedTime, dt); requestAnimationFrame(loop); }
  const m = /^#s(\d)$/.exec(location.hash || '');
  setScene(m ? +m[1] - 1 : 0);
  requestAnimationFrame(loop);
})();
</script>
